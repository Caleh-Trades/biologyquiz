<script>
const QUESTIONS = {"Chapter 1: Course Introduction":[{"q":"Anatomy is the study of","opts":["disease only","body structure","body function only","chemical reactions only"],"a":1,"exp":"From Chapter 1: Anatomy = Structure — the parts, where they sit, what they look like."},{"q":"Physiology is the study of","opts":["disease only","body structure only","body function","gross anatomy only"],"a":2,"exp":"From Chapter 1: Physiology = Function — how organs and systems normally work, alone and together."},{"q":"Pathophysiology is the study of","opts":["normal structure only","only chemistry","only gross anatomy","functional changes in disease"],"a":3,"exp":"From Chapter 1: Physiology = Function — how organs and systems normally work, alone and together."},{"q":"The relationship between anatomy and physiology is that","opts":["function determines structure only","only anatomy matters","they are unrelated","structure determines function"],"a":3,"exp":"Anatomy (structure) and physiology (function) are linked — structure determines function."},{"q":"A disease can be defined as","opts":["only genetic change","only infection","disruption of homeostasis","normal variation"],"a":2,"exp":"Disease disrupts the relatively constant internal state (homeostasis) that cells need."},{"q":"The course focuses on","opts":["only biochemistry","only microbiology","only plant biology","human anatomy and physiology"],"a":3,"exp":"CCST4083: human anatomy and physiology with an integrative focus on homeostasis."},{"q":"Gross anatomy examines","opts":["structures visible to the naked eye","only molecules","only tissues under microscope","only cells"],"a":0,"exp":"Gross (macroscopic) anatomy: study of the body using only the naked eye."},{"q":"Microscopic anatomy includes","opts":["only regional anatomy","only systemic anatomy","cytology and histology","only surface anatomy"],"a":2,"exp":"Microscopic anatomy uses a microscope — cytology (cells) and histology (tissues)."},{"q":"Systemic anatomy studies","opts":["only molecules","one region only","only cells","organ systems"],"a":3,"exp":"Systemic anatomy studies the body by organ systems."},{"q":"The principle of complementarity means","opts":["function reflects structure","only physiology matters","structure is irrelevant","anatomy and physiology are opposite"],"a":0,"exp":"Complementarity: function reflects structure."},{"q":"Cytology is the study of:","opts":["Cells","Tissues","Organs","Gross anatomy"],"a":0,"exp":"Cytology = study of cells; histology = study of tissues (microscopic anatomy)."},{"q":"The basic unit of the human body is the","opts":["organ","tissue","cell","organ system"],"a":2,"exp":"The cell is the smallest unit that can carry out all life processes (~100 trillion cells in humans)."},{"q":"Muscle cells and neurons are described as","opts":["supportive cells only","excitable cells","only connective cells","non-living units"],"a":1,"exp":"From Chapter 1: muscle cells and neurons are excitable cells."},{"q":"Four general categories of specialised cells include muscle, nerve, epithelial and","opts":["adipose only","connective-tissue cells","only blood cells","stem cells only"],"a":1,"exp":"Chapter 1 lists muscle, nerve, epithelial, and connective-tissue cells."}],"Chapter 2: Structural Organization":[{"q":"The levels of organisation from simplest to most complex are","opts":["cellular → chemical → organ","chemical → cellular → tissue → organ → organ system → organism","tissue → cell → chemical","organ system → organ → tissue"],"a":1,"exp":"Chemical → cellular → tissue → organ → organ system → organism (Chapter 2 / Synopsis 1)."},{"q":"The four basic tissue types are","opts":["muscle, fat, skin, bone","connective, vascular, neural, epithelial","epithelial, connective, muscle, nervous","epithelial, bone, blood, nerve"],"a":2,"exp":"Four major tissues: epithelial, connective, muscle, and nervous."},{"q":"An organ consists of","opts":["only cells of one type","two or more tissue types","only one tissue type","only extracellular matrix"],"a":1,"exp":"An organ has at least two different tissues and performs a specific function."},{"q":"There are how many major organ systems","opts":["12","8","9","11"],"a":3,"exp":"There are 11 organ systems in the human body (course notes)."},{"q":"In anatomical position the body is","opts":["erect, palms forward, feet together","arms raised","palms backward","lying down"],"a":0,"exp":"Anatomical position: body erect, arms at sides, palms forward, head and feet pointing forward."},{"q":"The sagittal plane divides the body into","opts":["superior and inferior","anterior and posterior","proximal and distal","left and right portions"],"a":3,"exp":"Sagittal plane divides the body into left and right portions (midsagittal = equal halves)."},{"q":"The frontal (coronal) plane divides the body into","opts":["medial and lateral","superior and inferior","anterior and posterior portions","left and right"],"a":2,"exp":"Frontal (coronal) plane divides into anterior and posterior portions."},{"q":"Supine means","opts":["standing","lying face downward","lying face upward","on the side"],"a":2,"exp":"Supine = lying face upward; prone = lying face downward."},{"q":"Proximal means","opts":["toward the midline","toward the surface","farther from the trunk","closer to the point of attachment or trunk"],"a":3,"exp":"Proximal = closer to the trunk / point of attachment; distal = farther away."},{"q":"The dorsal body cavity contains the","opts":["brain and spinal cord","digestive organs","only the brain","heart and lungs"],"a":0,"exp":"Dorsal cavity: cranial cavity (brain) + vertebral canal (spinal cord)."},{"q":"The correct order of levels of organisation is:","opts":["Chemical → Cellular → Tissue → Organ → Organ system → Organism","Cellular → Chemical → Organ → Tissue","Organ system → Organ → Tissue → Cell","Tissue → Cell → Chemical → Organ"],"a":0,"exp":"Chemical → cellular → tissue → organ → organ system → organism (Chapter 2 / Synopsis 1)."},{"q":"In anatomical position the palms face:","opts":["Forward","Backward","Down","Medially"],"a":0,"exp":"Anatomical position: body erect, arms at sides, palms forward, head and feet pointing forward."},{"q":"The plane that divides the body into left and right sides is:","opts":["Sagittal (midsagittal if equal)","Frontal (coronal)","Transverse","Oblique"],"a":0,"exp":"Sagittal plane divides the body into left and right portions (midsagittal = equal halves)."},{"q":"How many organ systems are listed in the course notes","opts":["11","9","12","8"],"a":0,"exp":"There are 11 organ systems in the human body (course notes)."},{"q":"A tissue is a group of:","opts":["Similar cells performing a common function","Different organs","Only connective tissue","Only one cell type with no matrix"],"a":0,"exp":"Basic definition of tissue."},{"q":"The dorsal body cavity contains:","opts":["Brain and spinal cord","Heart and lungs","Stomach and liver","Only the brain"],"a":0,"exp":"Dorsal cavity: cranial cavity (brain) + vertebral canal (spinal cord)."},{"q":"An organ is composed of:","opts":["Two or more tissue types","Only one tissue type","Only cells of the same type","Only extracellular matrix"],"a":0,"exp":"Organs contain multiple tissues."},{"q":"Prone means","opts":["lying face upward","lying face downward","standing erect","sitting"],"a":1,"exp":"Prone = lying face downward; supine = face upward (Synopsis 1)."},{"q":"The transverse plane divides the body into","opts":["left and right","anterior and posterior","superior and inferior parts","medial and lateral only"],"a":2,"exp":"Transverse (horizontal) plane divides into superior and inferior parts."},{"q":"Bilateral symmetry means","opts":["the body has no midline","right and left sides are mirror images","only the limbs are paired","the dorsal cavity is doubled"],"a":1,"exp":"Bilateral symmetry: right and left sides of the body are mirror images."},{"q":"The ventral body cavity includes the","opts":["cranial cavity only","thoracic and abdominopelvic cavities","vertebral canal only","mediastinum alone"],"a":1,"exp":"Ventral cavity: thoracic (pleural, mediastinum, pericardium) + abdominopelvic."}],"Chapter 3: Chemical Environment":[{"q":"Diffusion is movement from","opts":["high to low concentration","against the gradient only","only with ATP","low to high concentration"],"a":0,"exp":"Diffusion: molecules move from high to low concentration down a gradient (passive)."},{"q":"Passive transport does not require","opts":["water","a concentration gradient","ATP","a membrane"],"a":2,"exp":"Passive transport does not require ATP expenditure."},{"q":"An acid is a substance that","opts":["releases OH⁻","has pH > 7","releases H⁺ in solution","accepts H⁺"],"a":2,"exp":"An acid releases hydrogen ions (H⁺) in solution."},{"q":"pH 7 indicates","opts":["neutrality","strong alkalinity","strong acidity","slight acidity"],"a":0,"exp":"pH 7 = neutrality (equal H⁺ and OH⁻); <7 acidic; >7 alkaline."},{"q":"Osmosis is the diffusion of","opts":["water across a selectively permeable membrane","any solute","only ions","proteins only"],"a":0,"exp":"Diffusion: molecules move from high to low concentration down a gradient (passive)."},{"q":"Active transport","opts":["needs no membrane proteins","requires no energy","only moves lipid-soluble molecules","requires ATP and moves substances against their gradient"],"a":3,"exp":"Active transport requires ATP and moves substances against their concentration gradient."},{"q":"Water is a good solvent because of its","opts":["non-polar nature","high molecular weight","polarity","lack of hydrogen bonds"],"a":2,"exp":"Water’s polarity lets it act as an effective solvent."},{"q":"Normal extracellular Na⁺ concentration is approximately","opts":["108 mmol/L","4 mmol/L","142 mmol/L","1 mmol/L"],"a":2,"exp":"Course ECF values: extracellular Na⁺ ≈ 142 mmol/L."},{"q":"A hypertonic solution causes a cell to","opts":["divide","shrink (crenate)","remain unchanged","swell and possibly burst"],"a":1,"exp":"Hypertonic solution: water leaves the cell → cell shrinks (crenates)."},{"q":"The Na⁺/K⁺ ATPase is an example of","opts":["primary active transport","facilitated diffusion","osmosis","simple diffusion"],"a":0,"exp":"Na⁺/K⁺ ATPase uses ATP directly (primary active transport): 3 Na⁺ out, 2 K⁺ in."},{"q":"Diffusion is movement of molecules from:","opts":["High concentration to low concentration","Low to high concentration","Against the concentration gradient only","Only with ATP"],"a":0,"exp":"Diffusion: molecules move from high to low concentration down a gradient (passive)."},{"q":"Passive transport processes do NOT require:","opts":["ATP (energy)","A concentration gradient","A membrane","Water"],"a":0,"exp":"Passive transport does not require ATP expenditure."},{"q":"Active transport requires:","opts":["ATP (energy) and moves substances against the gradient","No energy","Only lipid-soluble molecules","No membrane proteins"],"a":0,"exp":"Against the gradient, uses energy."},{"q":"Facilitated diffusion requires:","opts":["A membrane protein but no ATP","ATP and a protein","No membrane","Only lipid solubility"],"a":0,"exp":"Diffusion: molecules move from high to low concentration down a gradient (passive)."},{"q":"The pH scale is logarithmic, so pH 6 is:","opts":["10 times more acidic than pH 7","Twice as acidic as pH 7","10 times less acidic than pH 7","The same as pH 7"],"a":0,"exp":"Each unit is a 10-fold change in [H+]."},{"q":"Buffers help maintain pH by:","opts":["Releasing or binding H+","Only releasing OH-","Destroying acids","Changing temperature"],"a":0,"exp":"Resist changes in pH."},{"q":"Primary active transport is exemplified by the:","opts":["Na+/K+ ATPase","Facilitated glucose transporter","Aquaporin","Simple diffusion of oxygen"],"a":0,"exp":"Correct answer: “Na+/K+ ATPase” (see lecture slides)."},{"q":"Secondary active transport uses the energy of:","opts":["An ion gradient established by primary transport","Direct ATP hydrolysis only","Heat","Light"],"a":0,"exp":"Co-transport or counter-transport."},{"q":"Normal extracellular K+ concentration is approximately:","opts":["4 mmol/L","140 mmol/L","100 mmol/L","1 mmol/L"],"a":0,"exp":"Much lower than intracellular K+."},{"q":"Osmolarity depends on:","opts":["The number of solute particles","The size of solute particles only","The charge of particles only","Temperature alone"],"a":0,"exp":"Colligative property."},{"q":"An isotonic solution has the same:","opts":["Osmolarity as the cell","pH as the cell","Temperature as the cell","Viscosity as the cell"],"a":0,"exp":"No net water movement."},{"q":"Water moves by osmosis from:","opts":["Low solute concentration to high solute concentration","High solute to low solute","Only with ATP","Against its gradient always"],"a":0,"exp":"Osmosis: diffusion of water through a selectively permeable membrane."},{"q":"A hypotonic solution causes a cell to","opts":["shrink","swell as water flows in","remain unchanged","lose its nucleus only"],"a":1,"exp":"Hypotonic: water flows into the cell → may swell (Synopsis 1)."},{"q":"Facilitated diffusion","opts":["requires ATP","moves substances against their gradient","uses carrier or channel proteins without ATP","is the same as active transport"],"a":2,"exp":"Diffusion: molecules move from high to low concentration down a gradient (passive)."},{"q":"Filtration is driven mainly by","opts":["hydrostatic pressure","ATP pumps only","action potentials","osmotic pressure only"],"a":0,"exp":"Filtration: hydrostatic pressure forces water and permeable solutes through a membrane (often in capillaries)."}],"Chapter 4: Cytology":[{"q":"The plasma membrane is best described as a","opts":["protein monolayer","carbohydrate mesh","cholesterol sheet only","phospholipid bilayer with embedded proteins"],"a":3,"exp":"Plasma membrane: phospholipid bilayer with embedded proteins (fluid mosaic model)."},{"q":"Cytoplasm consists of","opts":["nucleus only","plasma membrane only","extracellular fluid","cytosol plus organelles"],"a":3,"exp":"Cytoplasm = cytosol (watery intracellular fluid) + organelles."},{"q":"Mitochondria are the main site of","opts":["ATP production","lipid storage","DNA replication","protein synthesis"],"a":0,"exp":"Mitochondria are the main site of ATP production (cellular respiration)."},{"q":"Rough endoplasmic reticulum is studded with","opts":["ribosomes","mitochondria","lysosomes","centrioles"],"a":0,"exp":"Rough ER is studded with ribosomes and functions in protein synthesis."},{"q":"The Golgi apparatus","opts":["replicates DNA","performs phagocytosis only","produces ATP","modifies, packages and sorts proteins"],"a":3,"exp":"Golgi apparatus modifies, packages and sorts proteins."},{"q":"Lysosomes contain","opts":["only oxidative enzymes","contractile proteins","ribosomes","hydrolytic enzymes for intracellular digestion"],"a":3,"exp":"Lysosomes contain hydrolytic enzymes for intracellular digestion."},{"q":"The nucleus contains","opts":["genetic material (DNA)","only ATP","only lipids","only ribosomes"],"a":0,"exp":"The nucleus contains DNA; transcription (mRNA) occurs here before protein synthesis."},{"q":"The cytoskeleton provides","opts":["energy production only","structural support and intracellular transport","protein synthesis only","genetic storage"],"a":1,"exp":"Cytoskeleton: protein framework for support, movement, and intracellular transport."},{"q":"Excitable cells include","opts":["only epithelial cells","neurons and muscle cells","only blood cells","only connective tissue cells"],"a":1,"exp":"Muscle cells and neurons are excitable — they can generate action potentials (Chapter 1/4)."},{"q":"The fluid mosaic model describes the","opts":["plasma membrane","Golgi apparatus","mitochondrion","nucleus"],"a":0,"exp":"Plasma membrane: phospholipid bilayer with embedded proteins (fluid mosaic model)."},{"q":"The plasma membrane is primarily a:","opts":["Phospholipid bilayer with embedded proteins","Protein monolayer","Carbohydrate mesh","Cholesterol only"],"a":0,"exp":"Plasma membrane: phospholipid bilayer with embedded proteins (fluid mosaic model)."},{"q":"Cytosol + organelles =","opts":["Cytoplasm","Nucleus","Plasma membrane","Extracellular fluid"],"a":0,"exp":"Cytoplasm = cytosol (watery intracellular fluid) + organelles."},{"q":"The Golgi apparatus is involved in:","opts":["Modifying, packaging and sorting proteins","ATP synthesis","DNA transcription","Phagocytosis only"],"a":0,"exp":"Golgi apparatus modifies, packages and sorts proteins."},{"q":"Smooth endoplasmic reticulum mainly","opts":["makes ribosomal proteins","synthesises certain lipids and carbohydrates","stores DNA","forms tight junctions"],"a":1,"exp":"Smooth ER synthesises certain lipids and carbohydrates (Synopsis 1)."},{"q":"Transcription (production of mRNA) occurs in the","opts":["Golgi apparatus","mitochondrion","nucleus","lysosome"],"a":2,"exp":"The nucleus contains DNA; transcription (mRNA) occurs here before protein synthesis."}],"Chapter 5: Histology":[{"q":"The four basic tissue types are","opts":["muscle, fat, skin and bone","epithelial, bone, blood and nerve","epithelial, connective, muscle and nervous","connective, vascular, neural and epithelial"],"a":2,"exp":"Four major tissues: epithelial, connective, muscle, and nervous."},{"q":"Epithelial tissue is characterised by","opts":["abundant extracellular matrix","ability to contract","closely packed cells covering surfaces or lining cavities","long processes for conduction"],"a":2,"exp":"Epithelium: closely packed cells covering surfaces or lining cavities; little matrix."},{"q":"Tight junctions mainly","opts":["seal neighbouring cells to prevent leakage","anchor cells to the basal lamina","connect intermediate filaments","allow free ion passage"],"a":0,"exp":"Tight junctions seal neighbouring cells to prevent leakage between them."},{"q":"Gap junctions allow","opts":["attachment to extracellular matrix","strong mechanical attachment only","passage of small ions and molecules between cells","sealing of the sheet"],"a":2,"exp":"Gap junctions allow passage of small ions and molecules between cells."},{"q":"Connective tissue is characterised by","opts":["electrical excitability","closely packed cells with little matrix","cells embedded in abundant extracellular matrix","contractility"],"a":2,"exp":"Connective tissue: specialised cells embedded in abundant extracellular matrix."},{"q":"Simple squamous epithelium is specialised for","opts":["nutrient absorption only","mucus secretion","protection against abrasion","diffusion and filtration"],"a":3,"exp":"Simple squamous epithelium is specialised for diffusion and filtration."},{"q":"Cardiac muscle is","opts":["smooth and involuntary","striated and involuntary","striated and voluntary","smooth and voluntary"],"a":1,"exp":"Cardiac muscle is striated and involuntary."},{"q":"Neurons are specialised for","opts":["contraction","matrix secretion","conducting electrical signals","phagocytosis"],"a":2,"exp":"Neurons conduct electrical signals; nervous tissue also includes glial cells."},{"q":"Parenchyma refers to","opts":["blood vessels only","the outer capsule","the functional tissue of an organ","the supporting connective tissue only"],"a":2,"exp":"Parenchyma = functional tissue of an organ; stroma = supporting framework."},{"q":"Desmosomes provide","opts":["strong mechanical attachment between cells","attachment only to the basal lamina","a seal against leakage","direct cytoplasmic continuity"],"a":0,"exp":"Desmosomes provide strong mechanical attachment between cells."},{"q":"Muscle cells and neurons are examples of:","opts":["Excitable cells","Non-living cells","Only epithelial cells","Only connective tissue cells"],"a":0,"exp":"Muscle cells and neurons are excitable — they can generate action potentials (Chapter 1/4)."},{"q":"Skeletal muscle is","opts":["striated and voluntary","smooth and involuntary","striated and involuntary","non-striated and voluntary"],"a":0,"exp":"Skeletal = striated + voluntary; cardiac = striated + involuntary; smooth = non-striated + involuntary."},{"q":"The most common connective tissue is","opts":["bone","cartilage","loose (areolar) connective tissue","blood only"],"a":2,"exp":"Synopsis 1: most common connective tissue is loose connective tissue."},{"q":"Nervous tissue cells include neurons and","opts":["fibroblasts only","glial cells","osteocytes","keratinocytes"],"a":1,"exp":"Neurons conduct electrical signals; nervous tissue also includes glial cells."}],"Chapter 6: Homeostasis":[{"q":"Homeostasis means","opts":["a disease state","only temperature control","maintenance of a relatively constant internal environment","complete stillness"],"a":2,"exp":"Homeo- (constant) + -stasis (stable): a dynamic steady state within a narrow range."},{"q":"The three components of a homeostatic control system are","opts":["sensor, integrating center, effector","receptor, hormone, target","sensor, muscle, bone","brain, spinal cord, nerves"],"a":0,"exp":"Sensor → Integrating/Control Center → Effector (Chapter 6 / Synopsis 1)."},{"q":"Normal body temperature set point is approximately","opts":["38.5 °C","36 °C","37 °C","35 °C"],"a":2,"exp":"Set point ≈ 37 °C; normal range about 36.5–37.5 °C."},{"q":"When body temperature rises the response includes","opts":["only vasoconstriction","shivering and vasoconstriction","increased muscle tone only","sweating and vasodilation"],"a":3,"exp":"Too hot → sweating and vasodilation to lose heat (thermoregulation)."},{"q":"Negative feedback","opts":["does not involve the nervous system","is used only for blood clotting","amplifies the change","returns the variable toward the set point"],"a":3,"exp":"Negative feedback opposes the change and returns the variable toward the set point — main homeostatic mechanism."},{"q":"Blood glucose regulation is controlled mainly by","opts":["the respiratory system","only the nervous system","insulin and glucagon","skeletal muscle only"],"a":2,"exp":"Blood glucose: endocrine control mainly by insulin and glucagon."},{"q":"The two major control systems for homeostasis are","opts":["nervous and endocrine systems","cardiovascular and respiratory","skeletal and muscular","digestive and urinary"],"a":0,"exp":"Nervous (fast, electrical) and endocrine (hormones) systems maintain homeostasis."},{"q":"Normal blood pH is approximately","opts":["8.0","7.4 (7.35–7.45)","7.0","6.8"],"a":1,"exp":"Normal blood pH ≈ 7.4 (range about 7.35–7.45)."},{"q":"The integrating center for thermoregulation is the","opts":["thyroid","pituitary","adrenal medulla","hypothalamus"],"a":3,"exp":"Hypothalamus is the integrating/control centre for thermoregulation."},{"q":"Positive feedback","opts":["always restores the set point","is the main form of homeostasis","never occurs","amplifies the original change"],"a":3,"exp":"Positive feedback amplifies the original change (e.g. clotting); less common than negative feedback."},{"q":"What does 'homeostasis' mean","opts":["Constant + stable (dynamic steady state)","Static equilibrium only","Only temperature control","Disease state"],"a":0,"exp":"Homeo- (constant) + -stasis (stable). Dynamic steady state within a narrow range."},{"q":"The three main components of a homeostatic control system are:","opts":["Sensor, Integrating Center, Effector","Receptor, Hormone, Target","Brain, Spinal cord, Nerves","Sensor, Muscle, Bone"],"a":0,"exp":"Sensor → Integrating/Control Center → Effector (Chapter 6 / Synopsis 1)."},{"q":"When body temperature rises above set point, the response includes:","opts":["Sweating and vasodilation","Shivering and vasoconstriction","Only vasoconstriction","Increased muscle tone only"],"a":0,"exp":"Too hot → sweating and vasodilation to lose heat (thermoregulation)."},{"q":"Negative feedback in homeostasis:","opts":["Returns the variable toward the set point","Amplifies the change","Is used only for blood clotting","Does not involve the nervous system"],"a":0,"exp":"Negative feedback opposes the change and returns the variable toward the set point — main homeostatic mechanism."},{"q":"The set point for body temperature is maintained primarily by the:","opts":["Hypothalamus","Pituitary","Thyroid","Adrenal medulla"],"a":0,"exp":"Hypothalamus is the main integrating centre."},{"q":"Vasoconstriction of skin arterioles helps to:","opts":["Conserve heat","Lose heat","Increase sweating","Lower blood pressure only"],"a":0,"exp":"Vasoconstriction of skin arterioles conserves heat."},{"q":"Shivering is an example of:","opts":["Heat-generating effector response","Heat-losing response","Negative feedback sensor","Endocrine control only"],"a":0,"exp":"Shivering generates heat as an effector response when temperature falls."},{"q":"Positive feedback is rare in homeostasis because it:","opts":["Amplifies the original stimulus","Returns the variable to set point","Is slower than negative feedback","Only involves hormones"],"a":0,"exp":"Positive feedback amplifies the original change (e.g. clotting); less common than negative feedback."},{"q":"An example of positive feedback is:","opts":["Blood clotting","Thermoregulation","Blood glucose control","pH regulation"],"a":0,"exp":"Positive feedback amplifies the original change (e.g. clotting); less common than negative feedback."},{"q":"The effector in blood pressure regulation can be:","opts":["Heart and blood vessels","Only the kidneys","Sweat glands only","Skeletal muscle only"],"a":0,"exp":"Effectors for blood pressure include the heart and blood vessels."},{"q":"Homeostasis maintains conditions within a:","opts":["Narrow range around a set point","Fixed unchanging value","Wide range of extremes","Only during exercise"],"a":0,"exp":"Homeostasis keeps variables in a narrow range around a set point."},{"q":"The sensor in a homeostatic system detects:","opts":["Deviation from the set point","The effector response only","Hormone levels exclusively","Only external temperature"],"a":0,"exp":"Sensors/receptors detect deviation from ure only","Vibration only"],"a":0,"exp":"Nociceptors and thermoreceptors."},{"q":"Sebum has an antimicrobial effect partly because of its:","opts":["Slightly acidic pH","High sugar content","Alkaline pH","High protein content"],"a":0,"exp":"Sebaceous glands secrete sebum; its slightly acidic pH (~5.5) is antimicrobial (Synopsis 2)."},{"q":"The epidermis is avascular, so it obtains nutrients from:","opts":["The underlying dermis","Direct blood vessels in the epidermis","The hypodermis only","Sweat"],"a":0,"exp":"Diffusion from dermal capillaries."},{"q":"When cold, the hypothalamus triggers:","opts":["Vasoconstriction and shivering","Vasodilation and sweating","Only increased sebum","Decreased metabolic rate only"],"a":0,"exp":"Heat-conserving and heat-generating responses."},{"q":"The epidermis and dermis are joined by the","opts":["pleural membrane","basement (dermal-epidermal) membrane","pericardium","meninges"],"a":1,"exp":"Synopsis 2: epidermis and dermis joined by the basement membrane (dermal-epidermal junction)."},{"q":"If body temperature falls, effectors include","opts":["only sweating","increased muscle tone/shivering and vasoconstriction","only vasodilation","only sebaceous secretion"],"a":1,"exp":"Too cold → shivering / increased muscle tone and vasoconstriction (hypothalamus)."}],"Chapter 8: Anatomy of the Thorax":[{"q":"The thoracic cavity is bounded inferiorly by the","opts":["abdominal wall","diaphragm","pelvic floor","pericardium only"],"a":1,"exp":"The diaphragm bounds the thoracic cavity inferiorly."},{"q":"The mediastinum contains the","opts":["heart, great vessels, trachea and oesophagus","only the stomach","only the lungs","only the liver"],"a":0,"exp":"Mediastinum (central thorax): heart, great vessels, trachea, and oesophagus."},{"q":"The lungs are located in the","opts":["cranial cavity","pericardial cavity","peritoneal cavity","pleural cavities"],"a":3,"exp":"Lungs lie in the right and left pleural cavities."},{"q":"The diaphragm is the primary muscle of","opts":["forced expiration only","expiration only","swallowing","inspiration"],"a":3,"exp":"Diaphragm is the primary muscle of inspiration (phrenic nerve)."},{"q":"The trachea bifurcates into the","opts":["bronchioles directly","oesophagus","alveoli directly","right and left main bronchi"],"a":3,"exp":"Trachea bifurcates into right and left main bronchi."},{"q":"The heart is enclosed in the","opts":["peritoneum","meninges","pleura","pericardium"],"a":3,"exp":"The heart is enclosed in the pericardium."},{"q":"The thoracic cage is formed by","opts":["only ribs","ribs, sternum and thoracic vertebrae","only sternum","clavicles and scapulae only"],"a":1,"exp":"Thoracic cage: ribs, sternum, and thoracic vertebrae."},{"q":"The phrenic nerve innervates the","opts":["heart only","intercostal muscles only","lungs only","diaphragm"],"a":3,"exp":"Phrenic nerve (C3–C5) innervates the diaphragm."},{"q":"Pleural fluid","opts":["fills the alveoli","has no function","reduces friction during breathing","is found in the pericardium only"],"a":2,"exp":"Pleural fluid reduces friction during breathing."},{"q":"The apex of the lung extends","opts":["below the diaphragm","above the clavicle","into the abdomen","only to the 6th rib"],"a":1,"exp":"Lung apex extends above the clavicle into the neck."},{"q":"The thoracic cavity is part of the","opts":["dorsal body cavity","ventral body cavity","cranial cavity","vertebral canal"],"a":1,"exp":"Thoracic cavity is within the ventral body cavity (Synopsis 1)."},{"q":"Quiet inspiration mainly depends on contraction of the","opts":["abdominal muscles only","diaphragm","trapezius","biceps"],"a":1,"exp":"Diaphragm is the primary muscle of inspiration (phrenic nerve)."},{"q":"The pericardium surrounds the","opts":["lungs","heart","liver","brain"],"a":1,"exp":"The heart is enclosed in the pericardium."},{"q":"Each lung is enclosed in a","opts":["peritoneal sac","pleural sac","meningeal layer","synovial capsule"],"a":1,"exp":"Each lung sits in a pleural cavity/sac lined by pleura."},{"q":"The mediastinum lies","opts":["between the two pleural cavities","inside the abdominal cavity","inside the cranial cavity","only behind the kidneys"],"a":0,"exp":"Mediastinum (central thorax): heart, great vessels, trachea, and oesophagus."}],"Chapter 9: Cardiovascular System":[{"q":"The heart has how many chambers","opts":["2","4","3","5"],"a":1,"exp":"Four chambers: two atria and two ventricles."},{"q":"The right side of the heart pumps blood to the","opts":["brain only","body (systemic circulation)","lungs (pulmonary circulation)","liver only"],"a":2,"exp":"Right heart pumps to the lungs (pulmonary circulation)."},{"q":"The left ventricle pumps blood into the","opts":["coronary sinus","aorta","superior vena cava","pulmonary trunk"],"a":1,"exp":"Left ventricle ejects into the aorta (systemic circulation)."},{"q":"The valves between atria and ventricles are the","opts":["atrioventricular valves","only the pulmonary valve","semilunar valves","only the aortic valve"],"a":0,"exp":"Atrioventricular (AV) valves lie between atria and ventricles."},{"q":"The sino-atrial node is the","opts":["responsible for ventricular contraction only","located in the ventricle","only a backup pacemaker","normal pacemaker of the heart"],"a":3,"exp":"SA node is the normal pacemaker of the heart."},{"q":"Coronary arteries supply blood to the","opts":["myocardium","brain","liver","lungs"],"a":0,"exp":"Coronary arteries supply the myocardium (heart muscle itself)."},{"q":"The pulmonary veins carry","opts":["deoxygenated blood to the right atrium","oxygenated blood to the left atrium","blood to the lungs","blood from the body"],"a":1,"exp":"Pulmonary veins carry oxygenated blood to the left atrium."},{"q":"Systole refers to","opts":["only atrial filling","relaxation of the heart chambers","contraction of the heart chambers","only valve closure"],"a":2,"exp":"Systole = contraction of heart chambers; diastole = relaxation."},{"q":"The aorta arises from the","opts":["right ventricle","left atrium","left ventricle","right atrium"],"a":2,"exp":"Left ventricle ejects into the aorta (systemic circulation)."},{"q":"Capillaries are the site of","opts":["only conduction","only blood propulsion","exchange of gases, nutrients and wastes","only valve function"],"a":2,"exp":"Capillaries are one cell thick and built for exchange of gases, nutrients, and wastes."},{"q":"Diastole refers to","opts":["contraction of the chambers","relaxation of the heart chambers","only AV valve opening","coronary occlusion"],"a":1,"exp":"Diastole = relaxation/filling; systole = contraction."},{"q":"The pulmonary circuit carries blood from the right heart to the","opts":["body tissues","lungs and back to the left atrium","liver only","brain only"],"a":1,"exp":"Right heart pumps to the lungs (pulmonary circulation)."},{"q":"Semilunar valves are found at the exits of the","opts":["atria only","ventricles into the pulmonary trunk and aorta","superior vena cava","coronary sinus"],"a":1,"exp":"Semilunar (pulmonary and aortic) valves guard ventricular outflow."},{"q":"Blood flow order through vessels is generally","opts":["vein → capillary → artery","artery → arteriole → capillary → venule → vein","capillary → artery → vein","arteriole → vein → capillary"],"a":1,"exp":"Heart → large artery → arteriole → capillary → venule → vein → heart (Chapter 9)."},{"q":"Heart cells are electrically coupled so that","opts":["they contract independently at random","depolarisation can spread as a coordinated wave","they cannot generate action potentials","only the left atrium conducts"],"a":1,"exp":"Chapter 9: heart cells are electrically coupled; depolarisation spreads across the heart."},{"q":"Exchange of materials between blood and tissues occurs mainly in","opts":["large arteries","capillaries","the aorta only","the venae cavae"],"a":1,"exp":"Capillaries are one cell thick and built for exchange of gases, nutrients, and wastes."}]};
const ICONS = ["📘","🔬","🧪","🧫","🔬","⚖️","🧴","🫁","❤️"];
const SEEN_PREFIX = "seen_v3_";
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function init(){
  const menu = document.getElementById("menu");
  Object.keys(QUESTIONS).forEach((name,i)=>{
    const btn = document.createElement("button");
    btn.className = "topic-card";
    btn.innerHTML = `<div class="topic-icon">${ICONS[i]||"📖"}</div><div style="flex:1"><strong>${name}</strong><br><span style="font-size:.8rem;color:var(--muted)">${QUESTIONS[name].length} questions</span></div>`;
    btn.onclick = ()=>startQuiz(name);
    menu.appendChild(btn);
  });
}
let cat, qs, idx, score, answered;
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function showMenu(){showScreen("menu")}
function startQuiz(name){
  cat = name;
  const all = QUESTIONS[name];
  let seen = JSON.parse(localStorage.getItem(SEEN_PREFIX+name)||"[]");
  let pool = all.map((q,i)=>({q,i})).filter(x=>!seen.includes(x.i));
  if(pool.length < Math.min(8, all.length)){
    seen = [];
    localStorage.setItem(SEEN_PREFIX+name, "[]");
    pool = all.map((q,i)=>({q,i}));
  }
  shuffle(pool);
  qs = pool.slice(0, Math.min(10, pool.length)).map(x=>x.q);
  idx=0; score=0; answered=false;
  document.getElementById("nextBtn").textContent="Next";
  showScreen("quiz");
  renderQ();
}
function renderQ(){
  answered=false;
  document.getElementById("nextBtn").disabled=true;
  const q = qs[idx];
  document.getElementById("progress").textContent = `Question ${idx+1} of ${qs.length}`;
  let html = `<div class="q-text">${q.q}</div>`;
  q.opts.forEach((o,i)=>{ html += `<button class="opt-btn" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`; });
  html += `<div id="fb"></div>`;
  document.getElementById("questionCard").innerHTML = html;
}
function choose(i){
  if(answered) return;
  answered=true;
  const q = qs[idx];
  const btns = document.querySelectorAll(".opt-btn");
  btns.forEach(b=>b.disabled=true);
  const fb = document.getElementById("fb");
  if(i===q.a){ score++; btns[i].classList.add("correct"); fb.className="ok"; fb.innerHTML="<b>Correct!</b> "+q.exp; }
  else { btns[i].classList.add("wrong"); btns[q.a].classList.add("correct"); fb.className="bad"; fb.innerHTML="<b>Incorrect.</b> "+q.exp; }
  document.getElementById("nextBtn").disabled=false;
  if(idx===qs.length-1) document.getElementById("nextBtn").textContent="Finish";
}
function nextQ(){ if(idx < qs.length-1){ idx++; renderQ(); } else finish(); }
function finish(){
  let seen = JSON.parse(localStorage.getItem(SEEN_PREFIX+cat)||"[]");
  qs.forEach(q=>{ const i = QUESTIONS[cat].findIndex(x=>x.q===q.q); if(i!==-1 && !seen.includes(i)) seen.push(i); });
  localStorage.setItem(SEEN_PREFIX+cat, JSON.stringify(seen));
  const pct = Math.round(score/qs.length*100);
  document.getElementById("finalScore").textContent = score+"/"+qs.length;
  document.getElementById("scoreMsg").textContent = pct>=80 ? "Excellent!" : pct>=60 ? "Good work." : "Keep reviewing.";
  showScreen("score");
}
init();
</script>
