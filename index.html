    {q:"Facilitated diffusion requires:",opts:["A membrane protein but no ATP","ATP and a protein","No membrane","Only lipid solubility"],a:0,exp:"Passive carrier- or channel-mediated transport."},
    {q:"A hypertonic solution causes a cell to:",opts:["Shrink (crenate)","Swell and burst","Remain unchanged","Divide"],a:0,exp:"Water leaves the cell."},
    {q:"The pH scale is logarithmic, so pH 6 is:",opts:["10 times more acidic than pH 7","Twice as acidic as pH 7","10 times less acidic than pH 7","The same as pH 7"],a:0,exp:"Each unit is a 10-fold change in [H+]."},
    {q:"Buffers help maintain pH by:",opts:["Releasing or binding H+","Only releasing OH-","Destroying acids","Changing temperature"],a:0,exp:"Resist changes in pH."},
    {q:"Primary active transport is exemplified by the:",opts:["Na+/K+ ATPase","Facilitated glucose transporter","Aquaporin","Simple diffusion of oxygen"],a:0,exp:"Directly uses ATP."},
    {q:"Secondary active transport uses the energy of:",opts:["An ion gradient established by primary transport","Direct ATP hydrolysis only","Heat","Light"],a:0,exp:"Co-transport or counter-transport."},
    {q:"Normal extracellular K+ concentration is approximately:",opts:["4 mmol/L","140 mmol/L","100 mmol/L","1 mmol/L"],a:0,exp:"Much lower than intracellular K+."},
    {q:"Osmolarity depends on:",opts:["The number of solute particles","The size of solute particles only","The charge of particles only","Temperature alone"],a:0,exp:"Colligative property."},
    {q:"An isotonic solution has the same:",opts:["Osmolarity as the cell","pH as the cell","Temperature as the cell","Viscosity as the cell"],a:0,exp:"No net water movement."},
    {q:"Water moves by osmosis from:",opts:["Low solute concentration to high solute concentration","High solute to low solute","Only with ATP","Against its gradient always"],a:0,exp:"Toward the higher solute concentration."}
  ]
};

let currentCat='', questions=[], currentIdx=0, score=0, answered=false;

function getSeenKey(cat){return 'seen_'+cat;}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showMenu(){showScreen('menu');}

function startQuiz(cat){
  currentCat=cat;
  const all=QUESTIONS[cat]||[];
  const seenKey=getSeenKey(cat);
  let seen=JSON.parse(localStorage.getItem(seenKey)||'[]');
  let pool=all.map((q,i)=>({q,i})).filter(x=>!seen.includes(x.i));
  if(pool.length<6){seen=[];localStorage.setItem(seenKey,'[]');pool=all.map((q,i)=>({q,i}));}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  questions=pool.slice(0,Math.min(10,pool.length)).map(x=>x.q);
  currentIdx=0;score=0;answered=false;
  document.getElementById('nextBtn').textContent='Next';
  showScreen('quiz');
  showQuestion();
}

function showQuestion(){
  answered=false;
  const nextBtn=document.getElementById('nextBtn');
  nextBtn.disabled=true;
  const q=questions[currentIdx];
  const pct=Math.round((currentIdx/questions.length)*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('qLabel').textContent='Question '+(currentIdx+1)+' of '+questions.length;
  document.getElementById('qPct').textContent=pct+'%';
  let html='<div class="q-num">Question '+(currentIdx+1)+'</div><div class="q-text">'+q.q+'</div><div class="options">';
  q.opts.forEach((opt,i)=>{html+='<button class="opt-btn" onclick="selectOption('+i+')">'+String.fromCharCode(65+i)+'. '+opt+'</button>';});
  html+='</div><div class="feedback" id="feedback"></div>';
  document.getElementById('questionCard').innerHTML=html;
}

function selectOption(idx){
  if(answered)return;
  answered=true;
  const q=questions[currentIdx];
  const buttons=document.querySelectorAll('.opt-btn');
  buttons.forEach(b=>b.disabled=true);
  const feedback=document.getElementById('feedback');
  if(idx===q.a){score++;buttons[idx].classList.add('correct');feedback.className='feedback show correct';feedback.innerHTML='<strong>Correct!</strong> '+q.exp;}
  else{buttons[idx].classList.add('wrong');buttons[q.a].classList.add('correct');feedback.className='feedback show wrong';feedback.innerHTML='<strong>Incorrect.</strong> Answer: '+String.fromCharCode(65+q.a)+'. '+q.exp;}
  const nextBtn=document.getElementById('nextBtn');
  nextBtn.disabled=false;
  if(currentIdx===questions.length-1)nextBtn.textContent='Finish';
}

function nextQuestion(){
  if(currentIdx<questions.length-1){currentIdx++;showQuestion();}
  else{showScore();}
}

function showScore(){
  const seenKey=getSeenKey(currentCat);
  let seen=JSON.parse(localStorage.getItem(seenKey)||'[]');
  questions.forEach(q=>{
    const idx=QUESTIONS[currentCat].findIndex(x=>x.q===q.q);
    if(idx!==-1&&!seen.includes(idx))seen.push(idx);
  });
  localStorage.setItem(seenKey,JSON.stringify(seen));
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('finalScore').textContent=score+'/'+questions.length;
  let msg=pct>=90?'Excellent work!':pct>=70?'Good job — review a few points.':pct>=50?'Keep practising.':'Review the notes and try again.';
  document.getElementById('scoreMsg').textContent=msg;
  const key='best_'+currentCat;
  const prev=parseInt(localStorage.getItem(key)||'0');
  if(score>prev)localStorage.setItem(key,score);
  document.getElementById('bestScore').textContent='Best score for this topic: '+Math.max(score,prev)+'/'+questions.length;
  showScreen('score');
}
</script>
