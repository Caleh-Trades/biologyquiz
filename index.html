<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Biology Quiz</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #0d7377;
    --primary-light: #14a085;
    --accent: #2dd4bf;
    --correct: #10b981;
    --wrong: #ef4444;
    --text: #1e293b;
    --muted: #64748b;
    --shadow: 0 10px 25px -5px rgba(0,0,0,0.08), 0 4px 6px -2px rgba(0,0,0,0.04);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .app-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: white;
    padding: 1.25rem 1rem 1.5rem;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 4px 12px rgba(13,115,119,0.25);
  }
  .app-header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .app-header p { opacity: 0.9; font-size: 0.85rem; margin-top: 0.25rem; }
  .screen { display: none; animation: fadeIn 0.25s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .container { max-width: 480px; margin: 0 auto; padding: 1rem 1rem 2rem; }
  .topic-grid { display: grid; gap: 0.75rem; }
  .topic-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 1.1rem 1.15rem;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 0.9rem;
    cursor: pointer;
    border: none;
    width: 100%;
    text-align: left;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .topic-card:active { transform: scale(0.98); }
  .topic-icon {
    width: 48px; height: 48px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white; display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; flex-shrink: 0;
  }
  .topic-info { flex: 1; }
  .topic-info strong { display: block; font-size: 1.05rem; color: var(--text); }
  .topic-info span { font-size: 0.8rem; color: var(--muted); }
  .topic-count {
    background: #f1f5f9; color: var(--primary); font-weight: 600;
    padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem;
  }
  .progress-wrap { margin-bottom: 1rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
  .progress { height: 6px; background: #e2e8f0; border-radius: 3px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.3s; }
  .question-card {
    background: var(--card);
    border-radius: 20px;
    padding: 1.4rem 1.2rem;
    box-shadow: var(--shadow);
    margin-bottom: 1rem;
  }
  .q-num { color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
  .q-text { font-size: 1.15rem; font-weight: 600; line-height: 1.4; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .opt-btn {
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 0.95rem 1rem;
    text-align: left;
    font-size: 0.98rem;
    cursor: pointer;
    width: 100%;
    transition: all 0.12s;
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.98); }
  .opt-btn.correct { background: #d1fae5; border-color: var(--correct); color: #065f46; }
  .opt-btn.wrong { background: #fee2e2; border-color: var(--wrong); color: #991b1b; }
  .opt-btn:disabled { cursor: default; }
  .feedback {
    margin-top: 1rem;
    padding: 0.9rem 1rem;
    border-radius: 12px;
    font-size: 0.92rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #d1fae5; color: #065f46; }
  .feedback.wrong { background: #fee2e2; color: #991b1b; }
  .nav-row { display: flex; gap: 0.6rem; margin-top: 0.5rem; }
  .nav-btn {
    flex: 1; padding: 0.95rem; border: none; border-radius: 14px;
    font-size: 1rem; font-weight: 600; cursor: pointer; min-height: 50px;
  }
  .next-btn { background: var(--primary); color: white; }
  .next-btn:disabled { opacity: 0.5; }
  .back-btn { background: #e2e8f0; color: var(--text); }
  .score-screen { text-align: center; padding: 2rem 1rem; }
  .score-circle {
    width: 140px; height: 140px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white; display: flex; align-items: center; justify-content: center;
    margin: 1.5rem auto; font-size: 2.4rem; font-weight: 700;
    box-shadow: 0 10px 30px rgba(13,115,119,0.3);
  }
  .score-msg { color: var(--muted); margin-bottom: 1.5rem; font-size: 1.05rem; }
  .restart-btn {
    background: var(--primary); color: white; border: none;
    padding: 1rem 2rem; border-radius: 14px; font-size: 1rem; font-weight: 600;
    cursor: pointer; min-width: 200px;
  }
  .best { margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
  footer { text-align: center; padding: 1.5rem; color: var(--muted); font-size: 0.75rem; }
</style>
</head>
<body>
<div class="app-header">
  <h1>Biology Quiz</h1>
  <p>CCST4083 • Anatomy & Physiology</p>
</div>

<div class="container">
  <div id="menu" class="screen active">
    <div class="topic-grid">
      <button class="topic-card" onclick="startQuiz('Homeostasis')">
        <div class="topic-icon">⚖️</div>
        <div class="topic-info"><strong>Homeostasis</strong><span>Feedback & regulation</span></div>
        <span class="topic-count">8</span>
      </button>
      <button class="topic-card" onclick="startQuiz('Action Potential')">
        <div class="topic-icon">⚡</div>
        <div class="topic-info"><strong>Action Potential</strong><span>Neuron signalling</span></div>
        <span class="topic-count">8</span>
      </button>
      <button class="topic-card" onclick="startQuiz('Levels of Organization & Basics')">
        <div class="topic-icon">🔬</div>
        <div class="topic-info"><strong>Levels & Basics</strong><span>Organisation & terms</span></div>
        <span class="topic-count">8</span>
      </button>
      <button class="topic-card" onclick="startQuiz('Integumentary System')">
        <div class="topic-icon">🧴</div>
        <div class="topic-info"><strong>Integumentary</strong><span>Skin & glands</span></div>
        <span class="topic-count">10</span>
      </button>
      <button class="topic-card" onclick="startQuiz('Cells & Tissues')">
        <div class="topic-icon">🧫</div>
        <div class="topic-info"><strong>Cells & Tissues</strong><span>Cytology & histology</span></div>
        <span class="topic-count">8</span>
      </button>
      <button class="topic-card" onclick="startQuiz('Chemical Environment')">
        <div class="topic-icon">🧪</div>
        <div class="topic-info"><strong>Chemical Environment</strong><span>Ions, pH & transport</span></div>
        <span class="topic-count">8</span>
      </button>
    </div>
  </div>

  <div id="quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-label"><span id="qLabel">Question 1</span><span id="qPct">0%</span></div>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="question-card" id="questionCard"></div>
    <div class="nav-row">
      <button class="nav-btn back-btn" onclick="showMenu()">Topics</button>
      <button class="nav-btn next-btn" id="nextBtn" disabled onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <div id="score" class="screen">
    <div class="score-screen">
      <h2 style="color:var(--primary);">Quiz Complete</h2>
      <div class="score-circle" id="finalScore">0/0</div>
      <div class="score-msg" id="scoreMsg"></div>
      <button class="restart-btn" onclick="showMenu()">Back to Topics</button>
      <div class="best" id="bestScore"></div>
    </div>
  </div>
</div>
<footer>Based on your HKU SPACE lecture notes</footer>

<script>
const QUESTIONS = {
  "Homeostasis": [
    { q: "What does 'homeostasis' mean?", opts: ["Constant + stable (dynamic steady state)", "Static equilibrium only", "Only temperature control", "Disease state"], a: 0, exp: "Homeo- (constant) + -stasis (stable). Dynamic steady state within a narrow range." },
    { q: "The three main components of a homeostatic control system are:", opts: ["Sensor, Integrating Center, Effector", "Receptor, Hormone, Target", "Brain, Spinal cord, Nerves", "Sensor, Muscle, Bone"], a: 0, exp: "Sensor → Integrating/Control Center → Effector." },
    { q: "Normal body temperature set point is approximately:", opts: ["37 °C", "36 °C", "38.5 °C", "35 °C"], a: 0, exp: "Set point ≈ 37 °C; normal range 36.5–37.5 °C." },
    { q: "When body temperature rises above set point, the response includes:", opts: ["Sweating and vasodilation", "Shivering and vasoconstriction", "Only vasoconstriction", "Increased muscle tone only"], a: 0, exp: "Too hot → sweating + vasodilation." },
    { q: "Negative feedback in homeostasis:", opts: ["Returns the variable toward the set point", "Amplifies the change", "Is used only for blood clotting", "Does not involve the nervous system"], a: 0, exp: "Opposes the change to stabilise conditions." },
    { q: "Blood glucose regulation is controlled mainly by:", opts: ["Endocrine system (insulin & glucagon)", "Only the nervous system", "Skeletal muscle only", "Respiratory system"], a: 0, exp: "High blood sugar → insulin; low → glucagon." },
    { q: "The two major control systems for homeostasis are:", opts: ["Nervous system and Endocrine system", "Cardiovascular and Respiratory", "Digestive and Urinary", "Skeletal and Muscular"], a: 0, exp: "Nervous (fast) and Endocrine (hormones)." },
    { q: "Normal blood pH is approximately:", opts: ["7.4 (range 7.35–7.45)", "7.0", "6.8", "8.0"], a: 0, exp: "From the extracellular fluid table." }
  ],
  "Action Potential": [
    { q: "Resting membrane potential of a typical neuron is:", opts: ["-70 mV", "-55 mV", "0 mV", "+30 mV"], a: 0, exp: "RMP = -70 mV." },
    { q: "Threshold potential for an action potential is approximately:", opts: ["-55 mV", "-70 mV", "+30 mV", "-90 mV"], a: 0, exp: "≈ -55 mV triggers voltage-gated Na⁺ channels." },
    { q: "Depolarisation is caused by:", opts: ["Na⁺ influx through voltage-gated Na⁺ channels", "K⁺ efflux", "Cl⁻ influx", "Ca²⁺ efflux only"], a: 0, exp: "Na⁺ enters → potential rises toward +30 mV." },
    { q: "Repolarisation occurs when:", opts: ["Voltage-gated K⁺ channels open and K⁺ leaves the cell", "Na⁺ channels stay open", "Na⁺/K⁺ ATPase stops", "Cl⁻ channels close"], a: 0, exp: "K⁺ efflux returns membrane toward negative." },
    { q: "The Na⁺/K⁺ ATPase:", opts: ["Pumps 3 Na⁺ out and 2 K⁺ in to restore resting gradients", "Pumps equal numbers of both ions", "Is only active during depolarisation", "Does not use ATP"], a: 0, exp: "Restores ion gradients after the spike." },
    { q: "During the action potential, the membrane potential briefly reaches about:", opts: ["+30 mV", "-70 mV", "0 mV", "+70 mV"], a: 0, exp: "Peak ≈ +30 mV." },
    { q: "Hyperpolarisation can occur because:", opts: ["K⁺ channels stay open a little longer than needed", "Na⁺ channels open late", "ATP is depleted", "Cl⁻ channels close too early"], a: 0, exp: "Extra K⁺ efflux briefly makes inside more negative." },
    { q: "Action potentials are propagated along the axon by:", opts: ["Local currents opening nearby voltage-gated Na⁺ channels", "Only passive diffusion", "Hormonal signals", "Gap junctions only"], a: 0, exp: "Depolarisation triggers the next segment." }
  ],
  "Levels of Organization & Basics": [
    { q: "Anatomy is the study of:", opts: ["Body structure and relationships of parts", "Body functions only", "Diseases only", "Chemical reactions only"], a: 0, exp: "Anatomy = structure; Physiology = function." },
    { q: "The correct order of levels of organisation is:", opts: ["Chemical → Cellular → Tissue → Organ → Organ system → Organism", "Cellular → Chemical → Organ → Tissue", "Organ system → Organ → Tissue → Cell", "Tissue → Cell → Chemical → Organ"], a: 0, exp: "From the synopsis." },
    { q: "The four basic tissue types are:", opts: ["Epithelial, Connective, Muscle, Nervous", "Epithelial, Bone, Blood, Nerve", "Muscle, Fat, Skin, Bone", "Connective, Epithelial, Vascular, Neural"], a: 0, exp: "Standard classification." },
    { q: "Cytology is the study of:", opts: ["Cells", "Tissues", "Organs", "Gross anatomy"], a: 0, exp: "Cytology = cells; Histology = tissues." },
    { q: "In anatomical position the palms face:", opts: ["Forward", "Backward", "Down", "Medially"], a: 0, exp: "Body erect, palms forward." },
    { q: "The plane that divides the body into left and right sides is:", opts: ["Sagittal (midsagittal if equal)", "Frontal (coronal)", "Transverse", "Oblique"], a: 0, exp: "Sagittal plane." },
    { q: "Supine means:", opts: ["Lying face upward", "Lying face downward", "Standing", "On the side"], a: 0, exp: "Prone = face down." },
    { q: "How many organ systems are listed in the course notes?", opts: ["11", "9", "12", "8"], a: 0, exp: "11 systems." }
  ],
  "Integumentary System": [
    { q: "The three primary layers of the skin are:", opts: ["Epidermis, Dermis, Hypodermis", "Epidermis, Muscle, Bone", "Dermis, Fat, Muscle", "Stratum corneum, Dermis, Fascia"], a: 0, exp: "Epidermis, dermis, hypodermis." },
    { q: "Keratinocytes make up over 90% of cells in the:", opts: ["Epidermis", "Dermis", "Hypodermis", "Blood"], a: 0, exp: "Principal cells of the epidermis." },
    { q: "Melanocytes produce pigment that filters:", opts: ["Ultraviolet (UV) light", "Infrared light", "Visible light only", "X-rays"], a: 0, exp: "Protect against UV." },
    { q: "The most superficial epidermal layer is the:", opts: ["Stratum corneum (horny layer)", "Stratum basale", "Stratum spinosum", "Dermis"], a: 0, exp: "Dead cells filled with keratin." },
    { q: "Only cells in which layer undergo mitosis?", opts: ["Stratum basale (regenerative/base layer)", "Stratum corneum", "Dermis", "Hypodermis"], a: 0, exp: "Stratum basale." },
    { q: "Merocrine sweat glands primarily secrete:", opts: ["Sweat (for temperature regulation & waste elimination)", "Sebum", "Milk", "Hormones"], a: 0, exp: "Most numerous sweat glands." },
    { q: "Sebaceous glands secrete:", opts: ["Sebum (oily substance)", "Sweat", "Cerumen", "Mucus"], a: 0, exp: "Keeps skin/hair soft; antimicrobial pH." },
    { q: "Vitamin D synthesis begins when skin is exposed to:", opts: ["UV light (converts cholesterol to inactive vitamin D)", "Infrared light", "Blue light", "No light needed"], a: 0, exp: "Later activated in liver and kidneys." },
    { q: "Thermoregulation sensors include peripheral and:", opts: ["Internal thermoreceptors", "Photoreceptors", "Mechanoreceptors only", "Nociceptors only"], a: 0, exp: "Control centre = Hypothalamus." },
    { q: "When body temperature rises, the hypothalamus causes:", opts: ["Sweating and vasodilation of skin arterioles", "Shivering and vasoconstriction", "Only vasoconstriction", "Increased sebum production"], a: 0, exp: "Negative feedback for cooling." }
  ],
  "Cells & Tissues": [
    { q: "The plasma membrane is primarily a:", opts: ["Phospholipid bilayer with embedded proteins", "Protein monolayer", "Carbohydrate mesh", "Cholesterol only"], a: 0, exp: "Fluid mosaic model." },
    { q: "Cytosol + organelles =", opts: ["Cytoplasm", "Nucleus", "Plasma membrane", "Extracellular fluid"], a: 0, exp: "Cytoplasm." },
    { q: "Epithelial tissue is characterised by:", opts: ["Closely packed cells that cover surfaces or line hollow organs", "Abundant extracellular matrix", "Ability to contract", "Long processes for conduction"], a: 0, exp: "Covers, lines, protects, secretes." },
    { q: "Tight junctions mainly:", opts: ["Seal neighbouring cells to prevent leakage between them", "Allow ion passage", "Anchor to basal lamina", "Connect intermediate filaments"], a: 0, exp: "Prevent leakage." },
    { q: "Gap junctions allow:", opts: ["Passage of small water-soluble ions and molecules", "Strong mechanical attachment only", "Sealing of the epithelial sheet", "Attachment to extracellular matrix"], a: 0, exp: "Cell-to-cell communication." },
    { q: "The cytoskeleton provides:", opts: ["Structural support and intracellular transport", "Energy production only", "Genetic information storage", "Protein synthesis only"], a: 0, exp: "Support and transport." },
    { q: "Parenchyma refers to:", opts: ["The functional tissue of an organ", "The supporting connective tissue only", "Blood vessels only", "The outer capsule"], a: 0, exp: "Stroma = supporting tissue." },
    { q: "Muscle cells and neurons are examples of:", opts: ["Excitable cells", "Non-living cells", "Only epithelial cells", "Only connective tissue cells"], a: 0, exp: "Excitable cells." }
  ],
  "Chemical Environment": [
    { q: "Diffusion is movement of molecules from:", opts: ["High concentration to low concentration", "Low to high concentration", "Against the concentration gradient only", "Only with ATP"], a: 0, exp: "Down the concentration gradient." },
    { q: "Passive transport processes do NOT require:", opts: ["ATP (energy)", "A concentration gradient", "A membrane", "Water"], a: 0, exp: "No energy expenditure." },
    { q: "An acid is a substance that:", opts: ["Releases H⁺ in solution", "Accepts H⁺", "Releases OH⁻", "Has pH > 7"], a: 0, exp: "Releases hydrogen ions." },
    { q: "pH 7 indicates:", opts: ["Neutrality", "Strong acidity", "Strong alkalinity", "Slight acidity"], a: 0, exp: "Neutral." },
    { q: "Osmosis is the diffusion of:", opts: ["Water across a selectively permeable membrane", "Any solute", "Only ions", "Proteins only"], a: 0, exp: "Diffusion of water." },
    { q: "Active transport requires:", opts: ["ATP (energy) and moves substances against the gradient", "No energy", "Only lipid-soluble molecules", "No membrane proteins"], a: 0, exp: "Against the gradient, uses energy." },
    { q: "Water is a good solvent because of its:", opts: ["Polarity", "Non-polar nature", "High molecular weight", "Lack of hydrogen bonds"], a: 0, exp: "Polarity." },
    { q: "Normal extracellular Na⁺ concentration is approximately:", opts: ["142 mmol/L (range 138–146)", "4.2 mmol/L", "108 mmol/L", "1.2 mmol/L"], a: 0, exp: "≈ 142 mmol/L." }
  ]
};

let currentCat = '', questions = [], currentIdx = 0, score = 0, answered = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showMenu() { showScreen('menu'); }

function startQuiz(cat) {
  currentCat = cat;
  questions = [...QUESTIONS[cat]];
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  currentIdx = 0;
  score = 0;
  answered = false;
  document.getElementById('nextBtn').textContent = 'Next';
  showScreen('quiz');
  showQuestion();
}

function showQuestion() {
  answered = false;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  const q = questions[currentIdx];
  const pct = Math.round((currentIdx / questions.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('qLabel').textContent = `Question ${currentIdx + 1} of ${questions.length}`;
  document.getElementById('qPct').textContent = pct + '%';

  let html = `<div class="q-num">Question ${currentIdx + 1}</div>`;
  html += `<div class="q-text">${q.q}</div><div class="options">`;
  q.opts.forEach((opt, i) => {
    html += `<button class="opt-btn" onclick="selectOption(${i})">${String.fromCharCode(65+i)}. ${opt}</button>`;
  });
  html += `</div><div class="feedback" id="feedback"></div>`;
  document.getElementById('questionCard').innerHTML = html;
}

function selectOption(idx) {
  if (answered) return;
  answered = true;
  const q = questions[currentIdx];
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');
  if (idx === q.a) {
    score++;
    buttons[idx].classList.add('correct');
    feedback.className = 'feedback show correct';
    feedback.innerHTML = `<strong>Correct!</strong> ${q.exp}`;
  } else {
    buttons[idx].classList.add('wrong');
    buttons[q.a].classList.add('correct');
    feedback.className = 'feedback show wrong';
    feedback.innerHTML = `<strong>Incorrect.</strong> Answer: ${String.fromCharCode(65+q.a)}. ${q.exp}`;
  }
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = false;
  if (currentIdx === questions.length - 1) nextBtn.textContent = 'Finish';
}

function nextQuestion() {
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    showQuestion();
  } else {
    showScore();
  }
}

function showScore() {
  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('finalScore').textContent = `${score}/${questions.length}`;
  let msg = pct >= 90 ? 'Excellent work!' : pct >= 70 ? 'Good job — review a few points.' : pct >= 50 ? 'Keep practising.' : 'Review the notes and try again.';
  document.getElementById('scoreMsg').textContent = msg;
  const key = 'best_' + currentCat;
  const prev = parseInt(localStorage.getItem(key) || '0');
  if (score > prev) localStorage.setItem(key, score);
  document.getElementById('bestScore').textContent = `Best score for this topic: ${Math.max(score, prev)}/${questions.length}`;
  showScreen('score');
}
</script>
</body>
</html>
