const ICONS = ["📘","🔬","🧪","🧫","🔬","⚖️","🧴","🫁","❤️"];
function init(){
  const menu = document.getElementById("menu");
  Object.keys(QUESTIONS).forEach((name,i)=>{
    const btn = document.createElement("button");
    btn.className = "topic-card";
    btn.innerHTML = `<div class="topic-icon">${ICONS[i]||"📖"}</div><div style="flex:1"><strong>${name}</strong><br><span style="font-size:.8rem;color:var(--muted)">${QUESTIONS[name].length} questions</span></div>`;
    btn.onclick = ()=>startQuiz(name);
    menu.appendChild(btn);
  });
}
let cat, qs, idx, score, answered;
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function showMenu(){showScreen("menu")}
function startQuiz(name){
  cat = name;
  let all = QUESTIONS[name];
  let seen = JSON.parse(localStorage.getItem("seen_"+name)||"[]");
  let pool = all.map((q,i)=>({q,i})).filter(x=>!seen.includes(x.i));
  if(pool.length < 8){ seen=[]; localStorage.setItem("seen_"+name,"[]"); pool = all.map((q,i)=>({q,i})); }
  for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  qs = pool.slice(0,10).map(x=>x.q);
  idx=0; score=0; answered=false;
  document.getElementById("nextBtn").textContent="Next";
  showScreen("quiz");
  renderQ();
}
function renderQ(){
  answered=false;
  document.getElementById("nextBtn").disabled=true;
  const q = qs[idx];
  document.getElementById("progress").textContent = `Question ${idx+1} of ${qs.length}`;
  let html = `<div class="q-text">${q.q}</div>`;
  q.opts.forEach((o,i)=>{ html += `<button class="opt-btn" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`; });
  html += `<div id="fb" style="margin-top:.8rem;display:none"></div>`;
  document.getElementById("questionCard").innerHTML = html;
}
function choose(i){
  if(answered) return;
  answered=true;
  const q = qs[idx];
  const btns = document.querySelectorAll(".opt-btn");
  btns.forEach(b=>b.disabled=true);
  const fb = document.getElementById("fb");
  fb.style.display="block";
  if(i===q.a){ score++; btns[i].classList.add("correct"); fb.innerHTML="<b>Correct!</b> "+q.exp; fb.style.color="#065f46"; }
  else { btns[i].classList.add("wrong"); btns[q.a].classList.add("correct"); fb.innerHTML="<b>Incorrect.</b> "+q.exp; fb.style.color="#991b1b"; }
  document.getElementById("nextBtn").disabled=false;
  if(idx===qs.length-1) document.getElementById("nextBtn").textContent="Finish";
}
function nextQ(){
  if(idx < qs.length-1){ idx++; renderQ(); }
  else finish();
}
function finish(){
  let seen = JSON.parse(localStorage.getItem("seen_"+cat)||"[]");
  qs.forEach(q=>{
    let i = QUESTIONS[cat].findIndex(x=>x.q===q.q);
    if(i!==-1 && !seen.includes(i)) seen.push(i);
  });
  localStorage.setItem("seen_"+cat, JSON.stringify(seen));
  const pct = Math.round(score/qs.length*100);
  document.getElementById("finalScore").textContent = score+"/"+qs.length;
  document.getElementById("scoreMsg").textContent = pct>=80 ? "Excellent!" : pct>=60 ? "Good work." : "Keep reviewing.";
  showScreen("score");
}
init();
