<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Biology Quiz — Human Anatomy & Physiology (CCST4083)</title>
<style>
  :root {
    --bg: #f4f7f6;
    --card: #ffffff;
    --primary: #0d7377;
    --primary-dark: #095456;
    --accent: #14a085;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --text: #2c3e50;
    --muted: #7f8c8d;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    padding: 1.2rem 1rem;
    text-align: center;
    box-shadow: var(--shadow);
  }
  header h1 { font-size: clamp(1.4rem, 5vw, 1.8rem); margin-bottom: 0.25rem; }
  header p { opacity: 0.92; font-size: clamp(0.85rem, 3.5vw, 1rem); }
  .container { max-width: 800px; margin: 0 auto; padding: 1rem 0.9rem 2rem; }
  .categories { display: grid; gap: 0.85rem; margin-bottom: 1.5rem; }
  .cat-btn {
    background: var(--card);
    border: none;
    border-radius: 14px;
    padding: 1.15rem 1.2rem;
    text-align: left;
    font-size: 1.05rem;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.12s, box-shadow 0.12s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 64px;
    -webkit-user-select: none;
    user-select: none;
  }
  .cat-btn:active { transform: scale(0.98); }
  .cat-btn strong { color: var(--primary); }
  .cat-count { background: var(--primary); color: white; padding: 0.25rem 0.65rem; border-radius: 20px; font-size: 0.8rem; flex-shrink: 0; }
  .quiz-area { display: none; }
  .quiz-area.active { display: block; }
  .progress {
    height: 8px;
    background: #e0e0e0;
    border-radius: 4px;
    margin-bottom: 1.2rem;
    overflow: hidden;
  }
  .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
  .question-card {
    background: var(--card);
    border-radius: 16px;
    padding: 1.25rem 1.1rem;
    box-shadow: var(--shadow);
    margin-bottom: 1rem;
  }
  .q-num { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.4rem; }
  .q-text { font-size: clamp(1.05rem, 4.2vw, 1.2rem); font-weight: 600; margin-bottom: 1rem; }
  .options { display: flex; flex-direction: column; gap: 0.65rem; }
  .opt-btn {
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 12px;
    padding: 1rem 1rem;
    text-align: left;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.12s;
    min-height: 52px;
    -webkit-user-select: none;
    user-select: none;
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.98); }
  .opt-btn:hover:not(:disabled) { border-color: var(--primary); background: #e8f6f6; }
  .opt-btn.correct { background: #d5f5e3; border-color: var(--correct); }
  .opt-btn.wrong { background: #fadbd8; border-color: var(--wrong); }
  .opt-btn:disabled { cursor: default; }
  .feedback {
    margin-top: 1rem;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    font-size: 0.95rem;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #d5f5e3; color: #1e8449; }
  .feedback.wrong { background: #fadbd8; color: #922b21; }
  .nav-btns { display: flex; gap: 0.75rem; margin-top: 1rem; }
  .nav-btn {
    flex: 1;
    padding: 0.95rem;
    border: none;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    font-weight: 600;
    min-height: 52px;
    -webkit-user-select: none;
    user-select: none;
  }
  .nav-btn:active { transform: scale(0.98); }
  .next-btn { background: var(--primary); color: white; }
  .next-btn:hover { background: var(--primary-dark); }
  .back-btn { background: #e9ecef; color: var(--text); }
  .score-screen {
    background: var(--card);
    border-radius: 16px;
    padding: 1.75rem 1.2rem;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .score-screen h2 { color: var(--primary); margin-bottom: 0.5rem; }
  .score-num { font-size: clamp(2.4rem, 12vw, 3.2rem); font-weight: 700; color: var(--accent); margin: 0.8rem 0; }
  .score-msg { margin-bottom: 1.3rem; color: var(--muted); }
  .restart-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 1rem 1.8rem;
    border-radius: 12px;
    font-size: 1.05rem;
    cursor: pointer;
    font-weight: 600;
    min-height: 52px;
  }
  .restart-btn:active { transform: scale(0.98); }
  .best { font-size: 0.9rem; color: var(--muted); margin-top: 0.9rem; }
  footer { text-align: center; padding: 1.5rem 1rem 2rem; color: var(--muted); font-size: 0.8rem; }
    border-radius: 12px;
    padding: 0.8rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    color: var(--primary-dark);
    text-align: center;
  }
  @media (max-width: 480px) {
    .container { padding: 0.8rem 0.7rem 1.5rem; }
    .question-card { padding: 1.1rem 0.9rem; }
    .opt-btn, .nav-btn { font-size: 0.98rem; }
  }
</style>
</head>
<body>
<header>
  <h1>Biology Quiz</h1>
  <p>Human Anatomy & Physiology • CCST4083 • Based on your course files</p>
</header>
<div class="container">
  <div id="menu">
    <h2 style="margin-bottom:1rem; color:var(--primary);">Choose a topic</h2>
    <div class="categories" id="categories">
      <button class="cat-btn" onclick="startQuiz('Homeostasis')"><div><strong>Homeostasis</strong><br><span style="font-size:0.85rem;color:var(--muted)">8 questions</span></div><span class="cat-count">8</span></button>
      <button class="cat-btn" onclick="startQuiz('Action Potential')"><div><strong>Action Potential</strong><br><span style="font-size:0.85rem;color:var(--muted)">8 questions</span></div><span class="cat-count">8</span></button>
      <button class="cat-btn" onclick="startQuiz('Levels of Organization & Basics')"><div><strong>Levels of Organization & Basics</strong><br><span style="font-size:0.85rem;color:var(--muted)">8 questions</span></div><span class="cat-count">8</span></button>
      <button class="cat-btn" onclick="startQuiz('Integumentary System')"><div><strong>Integumentary System</strong><br><span style="font-size:0.85rem;color:var(--muted)">10 questions</span></div><span class="cat-count">10</span></button>
      <button class="cat-btn" onclick="startQuiz('Cells & Tissues')"><div><strong>Cells & Tissues</strong><br><span style="font-size:0.85rem;color:var(--muted)">8 questions</span></div><span class="cat-count">8</span></button>
      <button class="cat-btn" onclick="startQuiz('Chemical Environment')"><div><strong>Chemical Environment</strong><br><span style="font-size:0.85rem;color:var(--muted)">8 questions</span></div><span class="cat-count">8</span></button>
    </div>
</div>
  <div class="quiz-area" id="quizArea">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="question-card" id="questionCard"></div>
    <div class="nav-btns">
      <button class="nav-btn back-btn" id="backBtn">← Topics</button>
      <button class="nav-btn next-btn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>
  <div class="score-screen" id="scoreScreen" style="display:none;">
    <h2>Quiz Complete</h2>
    <div class="score-num" id="finalScore">0/0</div>
    <div class="score-msg" id="scoreMsg"></div>
    <button class="restart-btn" id="restartBtn">Try Another Topic</button>
    <div class="best" id="bestScore"></div>
  </div>
</div>
<footer>Questions generated from your HKU SPACE lecture notes, synopses & diagrams</footer>

<script>
const QUESTIONS = {
  "Homeostasis": [
    { q: "What does 'homeostasis' mean?", opts: ["Constant + stable (dynamic steady state)", "Static equilibrium only", "Only temperature control", "Disease state"], a: 0, exp: "Homeo- (constant) + -stasis (stable). It is a dynamic steady state maintained by regulatory mechanisms within a narrow range." },
    { q: "The three main components of a homeostatic control system are:", opts: ["Sensor, Integrating Center, Effector", "Receptor, Hormone, Target", "Brain, Spinal cord, Nerves", "Sensor, Muscle, Bone"], a: 0, exp: "From your synopsis: Sensor → Integrating/Control Center → Effector." },
    { q: "Normal body temperature set point is approximately:", opts: ["37 °C", "36 °C", "38.5 °C", "35 °C"], a: 0, exp: "Set point ≈ 37 °C; normal range 36.5–37.5 °C." },
    { q: "When body temperature rises above set point, the response includes:", opts: ["Sweating and vasodilation", "Shivering and vasoconstriction", "Only vasoconstriction", "Increased muscle tone only"], a: 0, exp: "Too hot → sweating + vasodilation to cool the body." },
    { q: "Negative feedback in homeostasis:", opts: ["Returns the variable toward the set point", "Amplifies the change", "Is used only for blood clotting", "Does not involve the nervous system"], a: 0, exp: "Negative feedback stabilises conditions by opposing the change." },
    { q: "Blood glucose regulation is an example of homeostasis controlled mainly by:", opts: ["Endocrine system (insulin & glucagon)", "Only the nervous system", "Skeletal muscle only", "Respiratory system"], a: 0, exp: "High blood sugar → insulin; low → glucagon (pancreas)." },
    { q: "The two major control systems for homeostasis are:", opts: ["Nervous system and Endocrine system", "Cardiovascular and Respiratory", "Digestive and Urinary", "Skeletal and Muscular"], a: 0, exp: "Nervous (fast, electrical) and Endocrine (slower, hormones)." },
    { q: "Normal blood pH is approximately:", opts: ["7.4 (range 7.35–7.45)", "7.0", "6.8", "8.0"], a: 0, exp: "From the extracellular fluid table in the homeostasis notes." }
  ],
  "Action Potential": [
    { q: "Resting membrane potential of a typical neuron is:", opts: ["-70 mV", "-55 mV", "0 mV", "+30 mV"], a: 0, exp: "RMP = -70 mV (from your notes)." },
    { q: "Threshold potential for an action potential is approximately:", opts: ["-55 mV", "-70 mV", "+30 mV", "-90 mV"], a: 0, exp: "When membrane potential reaches ≈ -55 mV, voltage-gated Na⁺ channels open." },
    { q: "Depolarisation is caused by:", opts: ["Na⁺ influx through voltage-gated Na⁺ channels", "K⁺ efflux", "Cl⁻ influx", "Ca²⁺ efflux only"], a: 0, exp: "Na⁺ enters → membrane potential rises toward +30 mV." },
    { q: "Repolarisation occurs when:", opts: ["Voltage-gated K⁺ channels open and K⁺ leaves the cell", "Na⁺ channels stay open", "Na⁺/K⁺ ATPase stops", "Cl⁻ channels close"], a: 0, exp: "At ~+30 mV, K⁺ channels open → K⁺ efflux → membrane returns toward negative." },
    { q: "The Na⁺/K⁺ ATPase:", opts: ["Pumps 3 Na⁺ out and 2 K⁺ in to restore resting gradients", "Pumps equal numbers of both ions", "Is only active during depolarisation", "Does not use ATP"], a: 0, exp: "Restores ion gradients after the action potential." },
    { q: "During the action potential, the membrane potential briefly reaches about:", opts: ["+30 mV", "-70 mV", "0 mV", "+70 mV"], a: 0, exp: "Peak of depolarisation ≈ +30 mV." },
    { q: "Hyperpolarisation can occur because:", opts: ["K⁺ channels stay open a little longer than needed", "Na⁺ channels open late", "ATP is depleted", "Cl⁻ channels close too early"], a: 0, exp: "Extra K⁺ efflux makes the inside more negative than RMP temporarily." },
    { q: "Action potentials are propagated along the axon by:", opts: ["Local currents opening nearby voltage-gated Na⁺ channels", "Only passive diffusion", "Hormonal signals", "Gap junctions only"], a: 0, exp: "Depolarisation at one point triggers the next segment." }
  ],
  "Levels of Organization & Basics": [
    { q: "Anatomy is the study of:", opts: ["Body structure and relationships of parts", "Body functions only", "Diseases only", "Chemical reactions only"], a: 0, exp: "Anatomy = structure; Physiology = function." },
    { q: "The correct order of levels of organisation is:", opts: ["Chemical → Cellular → Tissue → Organ → Organ system → Organism", "Cellular → Chemical → Organ → Tissue", "Organ system → Organ → Tissue → Cell", "Tissue → Cell → Chemical → Organ"], a: 0, exp: "From your synopsis notes." },
    { q: "The four basic tissue types are:", opts: ["Epithelial, Connective, Muscle, Nervous", "Epithelial, Bone, Blood, Nerve", "Muscle, Fat, Skin, Bone", "Connective, Epithelial, Vascular, Neural"], a: 0, exp: "Standard classification in histology chapter." },
    { q: "Cytology is the study of:", opts: ["Cells", "Tissues", "Organs", "Gross anatomy"], a: 0, exp: "Microscopic anatomy: Cytology (cells) and Histology (tissues)." },
    { q: "In anatomical position the palms face:", opts: ["Forward", "Backward", "Down", "Medially"], a: 0, exp: "Body erect, arms at sides, palms forward." },
    { q: "The plane that divides the body into left and right sides is:", opts: ["Sagittal (midsagittal if equal)", "Frontal (coronal)", "Transverse", "Oblique"], a: 0, exp: "From your directional terms & planes notes." },
    { q: "Supine means:", opts: ["Lying face upward", "Lying face downward", "Standing", "On the side"], a: 0, exp: "Prone = face down." },
    { q: "How many organ systems are listed in the course notes?", opts: ["11", "9", "12", "8"], a: 0, exp: "Nervous, Integumentary, Cardiovascular, Lymphatic, Respiratory, Digestive, Endocrine, Reproductive, Urinary, Muscular, Skeletal." }
  ],
  "Integumentary System": [
    { q: "The three primary layers of the skin are:", opts: ["Epidermis, Dermis, Hypodermis", "Epidermis, Muscle, Bone", "Dermis, Fat, Muscle", "Stratum corneum, Dermis, Fascia"], a: 0, exp: "From Synopsis 2." },
    { q: "Keratinocytes make up over 90% of cells in the:", opts: ["Epidermis", "Dermis", "Hypodermis", "Blood"], a: 0, exp: "Principal structural cells of the epidermis; produce keratin." },
    { q: "Melanocytes produce pigment that filters:", opts: ["Ultraviolet (UV) light", "Infrared light", "Visible light only", "X-rays"], a: 0, exp: "Contribute to skin colour and protect against UV." },
    { q: "The most superficial epidermal layer is the:", opts: ["Stratum corneum (horny layer)", "Stratum basale", "Stratum spinosum", "Dermis"], a: 0, exp: "Dead cells filled with keratin — barrier area." },
    { q: "Only cells in which layer undergo mitosis?", opts: ["Stratum basale (regenerative/base layer)", "Stratum corneum", "Dermis", "Hypodermis"], a: 0, exp: "They migrate upward and are eventually shed." },
    { q: "Merocrine sweat glands primarily secrete:", opts: ["Sweat (for temperature regulation & waste elimination)", "Sebum", "Milk", "Hormones"], a: 0, exp: "Most numerous sweat glands." },
    { q: "Sebaceous glands secrete:", opts: ["Sebum (oily substance)", "Sweat", "Cerumen", "Mucus"], a: 0, exp: "Keeps skin/hair soft; pH ~5.5 has antimicrobial effect." },
    { q: "Vitamin D synthesis begins when skin is exposed to:", opts: ["UV light (converts cholesterol to inactive vitamin D)", "Infrared light", "Blue light", "No light needed"], a: 0, exp: "Later activated in liver and kidneys; helps Ca²⁺ homeostasis." },
    { q: "Thermoregulation sensors include peripheral and:", opts: ["Internal thermoreceptors", "Photoreceptors", "Mechanoreceptors only", "Nociceptors only"], a: 0, exp: "Control centre = Hypothalamus." },
    { q: "When body temperature rises, the hypothalamus causes:", opts: ["Sweating and vasodilation of skin arterioles", "Shivering and vasoconstriction", "Only vasoconstriction", "Increased sebum production"], a: 0, exp: "Negative feedback loop for thermoregulation." }
  ],
  "Cells & Tissues": [
    { q: "The plasma membrane is primarily a:", opts: ["Phospholipid bilayer with embedded proteins", "Protein monolayer", "Carbohydrate mesh", "Cholesterol only"], a: 0, exp: "Fluid mosaic model — hydrophilic heads, hydrophobic tails." },
    { q: "Cytosol + organelles =", opts: ["Cytoplasm", "Nucleus", "Plasma membrane", "Extracellular fluid"], a: 0, exp: "From cytology notes." },
    { q: "Epithelial tissue is characterised by:", opts: ["Closely packed cells that cover surfaces or line hollow organs", "Abundant extracellular matrix", "Ability to contract", "Long processes for conduction"], a: 0, exp: "Covers, lines, protects, and secretes." },
    { q: "Tight junctions mainly:", opts: ["Seal neighbouring cells to prevent leakage between them", "Allow ion passage", "Anchor to basal lamina", "Connect intermediate filaments"], a: 0, exp: "From the cell junctions table in histology notes." },
    { q: "Gap junctions allow:", opts: ["Passage of small water-soluble ions and molecules", "Strong mechanical attachment only", "Sealing of the epithelial sheet", "Attachment to extracellular matrix"], a: 0, exp: "Communication between cells." },
    { q: "The cytoskeleton provides:", opts: ["Structural support and intracellular transport", "Energy production only", "Genetic information storage", "Protein synthesis only"], a: 0, exp: "Includes microvilli, contractile filaments, etc." },
    { q: "Parenchyma refers to:", opts: ["The functional tissue of an organ", "The supporting connective tissue only", "Blood vessels only", "The outer capsule"], a: 0, exp: "Stroma = supporting tissue." },
    { q: "Muscle cells and neurons are examples of:", opts: ["Excitable cells", "Non-living cells", "Only epithelial cells", "Only connective tissue cells"], a: 0, exp: "From levels of organisation notes." }
  ],
  "Chemical Environment": [
    { q: "Diffusion is movement of molecules from:", opts: ["High concentration to low concentration", "Low to high concentration", "Against the concentration gradient only", "Only with ATP"], a: 0, exp: "Passive transport down the concentration gradient until equilibrium." },
    { q: "Passive transport processes do NOT require:", opts: ["ATP (energy)", "A concentration gradient", "A membrane", "Water"], a: 0, exp: "From synopsis: passive = no energy expenditure." },
    { q: "An acid is a substance that:", opts: ["Releases H⁺ in solution", "Accepts H⁺", "Releases OH⁻", "Has pH > 7"], a: 0, exp: "Level of acidity depends on number of H⁺ released." },
    { q: "pH 7 indicates:", opts: ["Neutrality", "Strong acidity", "Strong alkalinity", "Slight acidity"], a: 0, exp: "pH < 7 acidic; pH > 7 alkaline." },
    { q: "Osmosis is the diffusion of:", opts: ["Water across a selectively permeable membrane", "Any solute", "Only ions", "Proteins only"], a: 0, exp: "Special case of diffusion for water." },
    { q: "Active transport requires:", opts: ["ATP (energy) and moves substances against the gradient", "No energy", "Only lipid-soluble molecules", "No membrane proteins"], a: 0, exp: "Opposite of passive processes." },
    { q: "Water is the body's most abundant molecule and acts as a good solvent because of its:", opts: ["Polarity", "Non-polar nature", "High molecular weight", "Lack of hydrogen bonds"], a: 0, exp: "Polarity allows it to ionise substances." },
    { q: "Normal extracellular Na⁺ concentration is approximately:", opts: ["142 mmol/L (range 138–146)", "4.2 mmol/L", "108 mmol/L", "1.2 mmol/L"], a: 0, exp: "From the homeostasis fluid table." }
  ]
};

const catContainer = document.getElementById('categories');
const menu = document.getElementById('menu');
const quizArea = document.getElementById('quizArea');
const scoreScreen = document.getElementById('scoreScreen');
const questionCard = document.getElementById('questionCard');
const progressBar = document.getElementById('progressBar');
const nextBtn = document.getElementById('nextBtn');
const backBtn = document.getElementById('backBtn');
const restartBtn = document.getElementById('restartBtn');
const finalScoreEl = document.getElementById('finalScore');
const scoreMsg = document.getElementById('scoreMsg');
const bestScoreEl = document.getElementById('bestScore');

let currentCat = '';
let questions = [];
let currentIdx = 0;
let score = 0;
let answered = false;

function startQuiz(cat) {
  currentCat = cat;
  questions = [...QUESTIONS[cat]];
  for (let i = questions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [questions[i], questions[j]] = [questions[j], questions[i]];
  }
  currentIdx = 0;
  score = 0;
  answered = false;
  menu.style.display = 'none';
  scoreScreen.style.display = 'none';
  quizArea.classList.add('active');
  showQuestion();
}

function showQuestion() {
  answered = false;
  nextBtn.disabled = true;
  const q = questions[currentIdx];
  const progress = ((currentIdx) / questions.length) * 100;
  progressBar.style.width = progress + '%';

  let html = `<div class="q-num">Question ${currentIdx + 1} of ${questions.length}</div>`;
  html += `<div class="q-text">${q.q}</div>`;
  html += `<div class="options">`;
  q.opts.forEach((opt, i) => {
    html += `<button class="opt-btn" data-idx="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`;
  });
  html += `</div>`;
  html += `<div class="feedback" id="feedback"></div>`;
  questionCard.innerHTML = html;

  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.onclick = () => selectOption(parseInt(btn.dataset.idx), q);
  });
}

function selectOption(idx, q) {
  if (answered) return;
  answered = true;
  const buttons = document.querySelectorAll('.opt-btn');
  buttons.forEach(b => b.disabled = true);

  const feedback = document.getElementById('feedback');
  if (idx === q.a) {
    score++;
    buttons[idx].classList.add('correct');
    feedback.className = 'feedback show correct';
    feedback.innerHTML = `<strong>Correct!</strong> ${q.exp}`;
  } else {
    buttons[idx].classList.add('wrong');
    buttons[q.a].classList.add('correct');
    feedback.className = 'feedback show wrong';
    feedback.innerHTML = `<strong>Incorrect.</strong> Correct answer: ${String.fromCharCode(65+q.a)}. ${q.exp}`;
  }
  nextBtn.disabled = false;
  if (currentIdx === questions.length - 1) nextBtn.textContent = 'See Score';
}

function nextQuestion() {
  if (currentIdx < questions.length - 1) {
    currentIdx++;
    showQuestion();
  } else {
    showScore();
  }
}

function showScore() {
  quizArea.classList.remove('active');
  scoreScreen.style.display = 'block';
  const pct = Math.round((score / questions.length) * 100);
  finalScoreEl.textContent = `${score}/${questions.length}`;
  let msg = '';
  if (pct >= 90) msg = 'Excellent! You know this material well.';
  else if (pct >= 70) msg = 'Good work — review the ones you missed.';
  else if (pct >= 50) msg = 'Keep studying the notes and try again.';
  else msg = 'Review the relevant chapters and retry.';
  scoreMsg.textContent = msg + ` (${pct}%)`;

  const key = 'best_' + currentCat;
  const prev = parseInt(localStorage.getItem(key) || '0');
  if (score > prev) {
    localStorage.setItem(key, score);
    bestScoreEl.textContent = `New best for ${currentCat}: ${score}/${questions.length}`;
  } else {
    bestScoreEl.textContent = `Best for ${currentCat}: ${prev}/${questions.length}`;
  }
}

nextBtn.onclick = nextQuestion;
backBtn.onclick = () => {
  quizArea.classList.remove('active');
  menu.style.display = 'block';
};
restartBtn.onclick = () => {
  scoreScreen.style.display = 'none';
  menu.style.display = 'block';
};

}
</script>
</body>
</html>
